[package]
name = "caelestia-plugin-ai"
version = "0.1.0"
edition = "2021"
description = "First-party caelestia-shell plugin: chat with OpenAI and Anthropic models from a bar panel"
license = "GPL-3.0-only"

[[bin]]
name = "caelestia-plugin-ai"
path = "src/main.rs"

[dependencies]
caelestia-plugin-sdk = { path = "../../plugin-sdk/rust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
strip = true
